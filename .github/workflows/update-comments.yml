name: Update Comment Counts

on:
  # 已取消每日自动运行，保留手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-counts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 更新评论数量
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-comment-counts.js

      - name: 提交更改
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/posts-list.json
          git diff --staged --quiet || git commit -m "chore: 自动更新评论数量"
          git push
